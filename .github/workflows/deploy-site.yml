name: Build & Deploy Package Catalog

on:
  push:
    branches: [main]
    paths:
      - "Index.idn"
      - "@*/README.md"
      - "@plugins/**"
      - "site/**"
      - "scripts/build_site.py"
      - ".github/workflows/deploy-site.yml"
  schedule:
    - cron: "20 4 * * 1"   # weekly safety rebuild (after GHDB refresh)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build catalog data (Index.idn -> packages.json + previews)
        run: python3 scripts/build_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
